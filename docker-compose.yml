# Creator Network — production stack for a single Linux VPS.
#
#   app    Node.js server (API, WebSockets, built web app). Not published to the internet;
#          only reachable by Caddy on the private "internal" network.
#   caddy  HTTPS reverse proxy with automatic Let's Encrypt certificates (ports 80/443).
#
# Persistent data (bind mounts, next to this file):
#   ./data     SQLite database + uploaded files       — back this up
#   ./backups  backup archives written by the app     — copy these off the server
# Caddy's certificates live in the named volumes caddy_data / caddy_config.
#
# Configuration comes from .env (copy .env.example). See docs/DEPLOYMENT.md.
name: creator-network

services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.21.0-bookworm-slim}
    image: creator-network:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      # Only Caddy (on the private network below) may set X-Forwarded-For.
      TRUST_PROXY: 172.28.0.0/24
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - internal
    expose:
      - '3000'
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
