# coturn settings for Creator Network voice rooms (see docs/VOICE.md).
# Secrets and addresses come from the command line (docker-compose.turn.yml), never from this file.

listening-port=3478
# TLS on 5349 needs certificates (cert= / pkey=); without them only 3478 (UDP/TCP) is used.
fingerprint

# Short-lived credentials (the app signs them with the shared secret: coturn "REST API").
use-auth-secret

# Relay ports (open the same range in the firewall).
min-port=49160
max-port=49200

# Limits: protect the VPS's bandwidth.
total-quota=60
user-quota=4
max-bps=1000000
stale-nonce=600

# Never relay into private or local networks (the VPS's own services stay unreachable).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-tlsv1
no-tlsv1_1
simple-log
log-file=stdout
